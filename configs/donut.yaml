# Donut fine-tuning configuration

model:
  name: "naver-clova-ix/donut-base"
  max_length: 768

training:
  epochs: 30
  batch_size: 2  # donut is memory-hungry, keep this low
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 300
  max_grad_norm: 1.0
  fp16: true
  gradient_accumulation_steps: 4  # effective batch size = 8

data:
  dataset: "cord"  # cord, funsd, or sroie
  image_size: [1280, 960]  # donut uses larger images

evaluation:
  # Donut uses tree edit distance + F1 on parsed JSON
  eval_every_n_epochs: 5
  save_best: true

augmentation:
  enabled: false
  rotation_range: 15
  blur_limit: 5
  quality_lower: 50

logging:
  wandb_project: "cs7643-doc-extraction"
  wandb_run_name: null
